<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Our Anniversary Story</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    
    <script src="https://unpkg.com/intersection-observer@0.5.1/intersection-observer.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* BASE SETTINGS */
        body { margin: 0; padding: 0; font-family: 'Lato', sans-serif; overflow-x: hidden; background: transparent; }
        #map { top: 0; height: 100vh; width: 100vw; position: fixed; z-index: 0; }
        #story { position: relative; z-index: 10; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: #2c3e50; }

        /* INTRO HEADER */
        #header {
            margin: auto; width: 100%; position: relative; z-index: 5;
            background: rgba(255, 255, 255, 0.95); padding: 6vh 0;
            text-align: center; border-bottom: 2px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }
        #header h1 { font-size: 3.2em; font-style: italic; color: #d4af37; margin: 0; }
        #header p { font-size: 1.1em; color: #555; margin-top: 10px; font-weight: 300; }

        /* THE NEW "BOTTOM SHEET" STORY CARDS */
        #features { padding-bottom: 5vh; }
        .step {
            height: 100vh; /* Forces each card to take exactly one screen */
            display: flex;
            align-items: flex-end; /* Pushes the card to the bottom */
            justify-content: center;
            padding-bottom: 8vh; /* Lifts it slightly off the bottom edge */
            opacity: 0.1;
            transition: opacity 0.6s ease;
        }
        .step.active { opacity: 1; }

        /* THE CARD ITSELF */
        .step div {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.92); /* Frosted Glass */
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 15px;
            display: flex; /* Puts image and text side-by-side */
            align-items: center;
            gap: 15px;
        }

        /* CLICKABLE THUMBNAIL */
        .step img {
            width: 90px;
            height: 90px;
            object-fit: cover; /* Keeps image beautifully squared */
            border-radius: 12px;
            border: 2px solid #d4af37;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        /* TEXT NEXT TO THUMBNAIL */
        .step-text { text-align: left; }
        .step h3 { margin: 0 0 5px 0; font-size: 1.2em; line-height: 1.2; }
        .step p { margin: 0; font-size: 0.95em; line-height: 1.4; color: #444; }
        .tap-hint { display: block; font-size: 0.7em; color: #d4af37; margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* FULL SCREEN LIGHTBOX (Hidden by default) */
        #lightbox {
            display: none; position: fixed; z-index: 99999;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background-color: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            align-items: center; justify-content: center;
            flex-direction: column; opacity: 0; transition: opacity 0.3s ease;
        }
        #lightbox.show { display: flex; opacity: 1; }
        #lightbox img { max-width: 95vw; max-height: 85vh; border-radius: 12px; border: 2px solid #d4af37; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .close-hint { color: #d4af37; font-family: 'Lato', sans-serif; margin-top: 20px; font-size: 0.9em; letter-spacing: 2px; text-transform: uppercase; }

        /* MUSIC & HEARTS */
        #music-control { position: fixed; top: 20px; right: 20px; z-index: 9000; background: white; padding: 10px; border-radius: 50%; border: 2px solid #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; font-size: 20px; }
        .heart { position: fixed; bottom: -10vh; font-size: 20px; color: #e74c3c; opacity: 0; z-index: 1; animation: floatUp 8s linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 0.7; } 100% { transform: translateY(-110vh) scale(1.2); opacity: 0; } }
    </style>
</head>

<body>

    <div id="map"></div>

    <div id="music-control" onclick="toggleMusic()">🎵</div>
    <audio id="bg-music" loop><source src="./assets/song.mp3" type="audio/mpeg"></audio>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
        <div class="close-hint">Tap anywhere to close</div>
    </div>

    <div id="story">
        <div id="header">
            <h1>Our Journey</h1>
            <p>Scroll to explore our memories...</p>
        </div>
        <div id="features"></div>
    </div>

    <script src="./config.js"></script>

    <script>
        // Set Header Text
        document.querySelector('#header h1').innerText = config.title;
        document.querySelector('#header p').innerText = config.subtitle;

        var features = document.getElementById('features');

        // GENERATE CHAPTERS WITH THUMBNAILS
        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');
            
            // 1. Add Image (Thumbnail)
            if (record.image) {
                var image = new Image();
                image.src = record.image;
                // Click to open Lightbox
                image.onclick = function() { openLightbox(this.src); };
                chapter.appendChild(image);
            }

            // 2. Add Text Container
            var textContainer = document.createElement('div');
            textContainer.classList.add('step-text');

            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                textContainer.appendChild(title);
            }
            if (record.description) {
                var story = document.createElement('p');
                story.innerHTML = record.description;
                textContainer.appendChild(story);
                
                // Add "Tap" hint if there is an image
                if(record.image) {
                    var hint = document.createElement('span');
                    hint.classList.add('tap-hint');
                    hint.innerText = "👆 Tap photo to expand";
                    textContainer.appendChild(hint);
                }
            }

            chapter.appendChild(textContainer);
            
            // Build the card
            container.setAttribute('id', record.id);
            container.classList.add('step');
            if (idx === 0) container.classList.add('active');
            
            container.appendChild(chapter);
            features.appendChild(container);
        });

        // MAPBOX SETUP
        mapboxgl.accessToken = config.accessToken;
        var map = new mapboxgl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            interactive: false
        });

        // SCROLL SETUP
        var scroller = scrollama();
        map.on("load", function() {
            scroller.setup({
                step: '.step',
                offset: 0.85, /* Triggers when card hits bottom of screen */
                progress: true
            })
            .onStepEnter(response => {
                var chapter = config.chapters.find(chap => chap.id === response.element.id);
                response.element.classList.add('active');
                map.flyTo(chapter.location);
            })
            .onStepExit(response => {
                response.element.classList.remove('active');
            });
        });

        // LIGHTBOX FUNCTIONS
        function openLightbox(imgSrc) {
            var lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = imgSrc;
            lightbox.style.display = 'flex';
            setTimeout(() => { lightbox.classList.add('show'); }, 10); // Smooth fade in
        }
        function closeLightbox() {
            var lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('show');
            setTimeout(() => { lightbox.style.display = 'none'; }, 300); // Wait for fade out
        }

        // MUSIC & HEARTS
        function toggleMusic() {
            var audio = document.getElementById("bg-music");
            var btn = document.getElementById("music-control");
            if (audio.paused) { audio.play(); btn.innerHTML = "⏸️"; } 
            else { audio.pause(); btn.innerHTML = "🎵"; }
        }
        setInterval(() => {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 5 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }, 800);
    </script>
</body>
</html>
