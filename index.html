<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Our Anniversary Story</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    <script src="https://unpkg.com/intersection-observer@0.5.1/intersection-observer.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* MAP DEMOTION */
        body { margin: 0; padding: 0; font-family: 'Lora', serif; overflow-x: hidden; background: #fdfbf7; color: #2c2c2c; }
        
        #map { 
            top: 0; height: 100vh; width: 100vw; position: fixed; z-index: 0; 
            filter: sepia(40%) contrast(0.85) saturate(0.6) hue-rotate(-5deg);
            opacity: 0.45; 
        }
        #story { position: relative; z-index: 10; }

        /* COVER PAGE */
        #header {
            margin: 0; width: 100%; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(to bottom, rgba(253, 251, 247, 1) 20%, rgba(253, 251, 247, 0.0) 100%);
            text-align: center;
        }
        #header h1 { font-family: 'Lora', serif; font-size: 3.5em; font-weight: 400; color: #2c2c2c; margin: 0; letter-spacing: 1px; }
        #header p { font-family: 'Caveat', cursive; font-size: 2.2em; color: #6b5b4c; margin-top: 5px; font-weight: 400; }
        .scroll-hint { font-family: 'Lora', serif; font-size: 0.8em; text-transform: uppercase; letter-spacing: 3px; color: #888; margin-top: 50px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        /* CARD LAYOUT (Fading Fix) */
        #features { padding-bottom: 10vh; padding-top: 10vh; }
        .step {
            /* Changed to 100vh so the card stays solid on screen much longer */
            min-height: 100vh; 
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease;
            transform: translateY(30px);
        }
        .step.active { opacity: 1; transform: translateY(0); }

        .card-content {
            width: 88%; max-width: 500px;
            background: rgba(255, 255, 255, 0.95); 
            border: 1px solid #eaeaea; border-radius: 8px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
            padding: 25px;
            display: flex; align-items: flex-start; gap: 20px;
        }

        @media (max-width: 600px) {
            .card-content { flex-direction: column; align-items: center; text-align: center; padding: 20px 15px; }
            .step-text { text-align: center !important; }
            .step img { transform: rotate(0deg) !important; width: 120px !important; height: 120px !important; margin-bottom: 10px; }
        }

        .step img {
            width: 100px; height: 100px; object-fit: cover;
            background: white; padding: 5px 5px 15px 5px; 
            border: 1px solid #e2e2e2; box-shadow: 2px 4px 10px rgba(0,0,0,0.08);
            transform: rotate(-2deg); cursor: pointer; flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .step img:hover { transform: rotate(0deg) scale(1.03); }
        
        .step-text { text-align: left; width: 100%; }
        .date-text { font-family: 'Caveat', cursive; font-size: 1.8em; color: #8b7355; line-height: 1; margin: 0 0 5px 0; }
        .step h3 { font-size: 1.2em; font-weight: 600; margin: 0 0 8px 0; letter-spacing: 0.5px; }
        .step p { margin: 0; font-size: 1em; line-height: 1.6; color: #4a4a4a; }
        .tap-hint { display: inline-block; font-family: 'Caveat', cursive; font-size: 1.3em; color: #a99a86; margin-top: 10px; cursor: pointer; }

        /* ENHANCED LIGHTBOX */
        #lightbox {
            display: none; position: fixed; z-index: 99999;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background-color: rgba(253, 251, 247, 0.98); 
            opacity: 0; transition: opacity 0.4s ease;
            overflow-y: auto; padding-top: 5vh; padding-bottom: 5vh;
            box-sizing: border-box;
        }
        #lightbox.show { display: block; opacity: 1; }
        
        .lightbox-container {
            max-width: 600px; margin: 0 auto; width: 90%;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        #lightbox img { 
            max-width: 100%; max-height: 55vh; 
            background: white; padding: 10px 10px 25px 10px; 
            border: 1px solid #e2e2e2; box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            margin-bottom: 25px;
        }
        #lb-date { font-family: 'Caveat', cursive; font-size: 2.2em; color: #8b7355; margin-bottom: 5px; line-height: 1;}
        #lb-title { font-family: 'Lora', serif; font-size: 1.4em; font-weight: 600; color: #2c2c2c; margin: 0 0 15px 0; }
        #lb-desc { font-family: 'Lora', serif; font-size: 1.1em; line-height: 1.7; color: #4a4a4a; margin: 0; }
        
        .close-hint { font-family: 'Lora', serif; font-size: 0.8em; letter-spacing: 2px; color: #888; margin-top: 40px; text-transform: uppercase; cursor: pointer; border: 1px solid #ccc; padding: 10px 20px; border-radius: 20px;}

        /* MUSIC BUTTON */
        #music-control { 
            position: fixed; top: 20px; right: 20px; z-index: 9000; 
            background: rgba(255,255,255,0.8); border: 1px solid #888; color: #666;
            padding: 8px 16px; border-radius: 30px; 
            font-family: 'Lora', serif; font-size: 0.75em; letter-spacing: 2px;
            cursor: pointer; backdrop-filter: blur(5px);
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <button id="music-control" onclick="toggleMusic()">PLAY MUSIC</button>
    <audio id="bg-music" loop><source src="./assets/song.mp3" type="audio/mpeg"></audio>

    <div id="lightbox">
        <div class="lightbox-container">
            <img id="lightbox-img" src="">
            <div id="lb-date"></div>
            <div id="lb-title"></div>
            <div id="lb-desc"></div>
            <div class="close-hint" onclick="closeLightbox()">Close Story</div>
        </div>
    </div>

    <div id="story">
        <div id="header">
            <h1 id="main-title">Our Journey</h1>
            <p id="sub-title">A story across cities, years, and forever</p>
            <div class="scroll-hint">Scroll Down</div>
        </div>
        <div id="features"></div>
    </div>

    <script src="./config.js"></script>

    <script>
        document.getElementById('main-title').innerText = config.title;
        document.getElementById('sub-title').innerText = config.subtitle;

        var features = document.getElementById('features');

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            container.setAttribute('id', record.id);
            container.classList.add('step');

            var cardContent = document.createElement('div');
            cardContent.classList.add('card-content');
            
            var parsedDate = "";
            var parsedTitle = record.title;
            var parts = record.title ? record.title.split(' • ') : [];
            if(parts.length > 1) {
                parsedDate = parts[0];
                parsedTitle = parts[1];
            }

            if (record.image) {
                var image = new Image();
                image.src = record.image;
                image.onclick = function() { 
                    openLightbox(this.src, parsedDate, parsedTitle, record.description); 
                };
                cardContent.appendChild(image);
            }

            var textContainer = document.createElement('div');
            textContainer.classList.add('step-text');

            if (parsedDate) {
                var dateEl = document.createElement('div');
                dateEl.classList.add('date-text');
                dateEl.innerText = parsedDate;
                textContainer.appendChild(dateEl);
            }
            if (parsedTitle) {
                var titleEl = document.createElement('h3');
                titleEl.innerText = parsedTitle;
                textContainer.appendChild(titleEl);
            }
            if (record.description) {
                var story = document.createElement('p');
                story.innerHTML = record.description;
                textContainer.appendChild(story);
                
                if(record.image) {
                    var hint = document.createElement('span');
                    hint.classList.add('tap-hint');
                    hint.innerText = "Read entry & view photo ➔";
                    hint.onclick = function() { openLightbox(record.image, parsedDate, parsedTitle, record.description); };
                    textContainer.appendChild(hint);
                }
            }

            cardContent.appendChild(textContainer);
            container.appendChild(cardContent);
            features.appendChild(container);
        });

        mapboxgl.accessToken = config.accessToken;
        var map = new mapboxgl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            interactive: false
        });

        var scroller = scrollama();
        map.on("load", function() {
            scroller.setup({
                step: '.step',
                offset: 0.6, /* Triggers comfortably right in the middle of the screen */
                progress: true
            })
            .onStepEnter(response => {
                var chapter = config.chapters.find(chap => chap.id === response.element.id);
                response.element.classList.add('active');
                
                /* FASTER, MORE PRONOUNCED MAP FLIGHT */
                map.flyTo({
                    center: chapter.location.center,
                    zoom: chapter.location.zoom,
                    pitch: chapter.location.pitch,
                    bearing: chapter.location.bearing,
                    speed: 1.2,       /* Sped up dramatically (was 0.4) */
                    curve: 1.5,       /* Deep zooming curve to make transitions cinematic */
                    essential: true
                });
            })
            .onStepExit(response => {
                response.element.classList.remove('active');
            });
        });

        function openLightbox(imgSrc, date, title, desc) {
            document.getElementById('lightbox-img').src = imgSrc;
            document.getElementById('lb-date').innerText = date || "";
            document.getElementById('lb-title').innerText = title || "";
            document.getElementById('lb-desc').innerHTML = desc || "";
            
            var lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'block';
            setTimeout(() => { lightbox.classList.add('show'); }, 10);
        }
        
        function closeLightbox() {
            var lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('show');
            setTimeout(() => { lightbox.style.display = 'none'; }, 400);
        }

        function toggleMusic() {
            var audio = document.getElementById("bg-music");
            var btn = document.getElementById("music-control");
            if (audio.paused) { 
                audio.play(); 
                btn.innerText = "PAUSE MUSIC"; 
                btn.style.background = "#6b5b4c"; btn.style.color = "white";
            } else { 
                audio.pause(); 
                btn.innerText = "PLAY MUSIC"; 
                btn.style.background = "rgba(255,255,255,0.8)"; btn.style.color = "#666";
            }
        }
    </script>
</body>
</html>
