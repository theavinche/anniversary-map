<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Our Anniversary Story</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    <script src="https://unpkg.com/intersection-observer@0.5.1/intersection-observer.js"></script>
    <script src="https://unpkg.com/scrollama"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* BASE & MAP STYLING */
        body { margin: 0; padding: 0; font-family: 'Lora', serif; overflow-x: hidden; background: #fdfbf7; color: #2c2c2c; }
        
        /* Adds a warm, nostalgic, cinematic filter to the map */
        #map { 
            top: 0; height: 100vh; width: 100vw; position: fixed; z-index: 0; 
            filter: sepia(30%) contrast(0.95) saturate(0.8) hue-rotate(-5deg);
        }
        #story { position: relative; z-index: 10; }

        /* THE COVER PAGE */
        #header {
            margin: 0; width: 100%; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(to bottom, rgba(253, 251, 247, 0.95) 40%, rgba(253, 251, 247, 0.0) 100%);
            text-align: center;
        }
        #header h1 { font-family: 'Lora', serif; font-size: 3.5em; font-weight: 400; color: #2c2c2c; margin: 0; letter-spacing: 1px; }
        #header p { font-family: 'Caveat', cursive; font-size: 2em; color: #6b5b4c; margin-top: 5px; font-weight: 400; }
        .scroll-hint { font-family: 'Lora', serif; font-size: 0.8em; text-transform: uppercase; letter-spacing: 3px; color: #888; margin-top: 40px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        /* SCRAPBOOK MOBILE CARDS */
        #features { padding-bottom: 5vh; }
        .step {
            height: 100vh; 
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 8vh; 
            opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease;
            transform: translateY(20px);
        }
        .step.active { opacity: 1; transform: translateY(0); }

        /* THE PAPER TEXTURE CARD */
        .step div {
            width: 88%; max-width: 450px;
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 4px; /* Sharp, paper-like edges */
            box-shadow: 0 15px 35px rgba(0,0,0,0.08), 0 5px 15px rgba(0,0,0,0.03);
            padding: 25px;
            display: flex; align-items: center; gap: 20px;
            position: relative;
        }

        /* POLAROID STYLE IMAGES */
        .step img {
            width: 100px; height: 100px; object-fit: cover;
            background: white;
            padding: 6px 6px 18px 6px; /* Thicker bottom padding for Polaroid look */
            border: 1px solid #e2e2e2;
            box-shadow: 2px 4px 12px rgba(0,0,0,0.1);
            transform: rotate(-3deg); /* Slightly crooked like placed by hand */
            cursor: pointer; flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .step img:hover { transform: rotate(0deg) scale(1.05); }
        
        /* TYPOGRAPHY IN THE CARD */
        .step-text { text-align: left; }
        .date-text { font-family: 'Caveat', cursive; font-size: 1.6em; color: #8b7355; line-height: 1; margin: 0 0 5px 0; }
        .step h3 { font-size: 1.1em; font-weight: 600; margin: 0 0 8px 0; letter-spacing: 0.5px; }
        .step p { margin: 0; font-size: 0.95em; line-height: 1.6; color: #4a4a4a; }
        .tap-hint { display: block; font-family: 'Caveat', cursive; font-size: 1.2em; color: #a99a86; margin-top: 8px; }

        /* ELEGANT LIGHTBOX */
        #lightbox {
            display: none; position: fixed; z-index: 99999;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background-color: rgba(253, 251, 247, 0.98); /* Warm ivory overlay instead of black */
            align-items: center; justify-content: center; flex-direction: column; 
            opacity: 0; transition: opacity 0.4s ease;
        }
        #lightbox.show { display: flex; opacity: 1; }
        #lightbox img { 
            max-width: 90vw; max-height: 80vh; 
            background: white; padding: 10px 10px 30px 10px; 
            border: 1px solid #e2e2e2; box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
        }
        .close-hint { font-family: 'Lora', serif; font-size: 0.8em; letter-spacing: 2px; color: #888; margin-top: 30px; text-transform: uppercase; }

        /* MINIMALIST MUSIC BUTTON */
        #music-control { 
            position: fixed; top: 25px; right: 25px; z-index: 9000; 
            background: transparent; border: 1px solid #888; color: #666;
            padding: 8px 16px; border-radius: 30px; 
            font-family: 'Lora', serif; font-size: 0.75em; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(5px);
        }
        #music-control:hover { background: #888; color: white; }
    </style>
</head>

<body>

    <div id="map"></div>

    <button id="music-control" onclick="toggleMusic()">PLAY MUSIC</button>
    <audio id="bg-music" loop><source src="./assets/song.mp3" type="audio/mpeg"></audio>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
        <div class="close-hint">Close</div>
    </div>

    <div id="story">
        <div id="header">
            <h1 id="main-title">Our Journey</h1>
            <p id="sub-title">A story across cities, years, and forever</p>
            <div class="scroll-hint">Begin Scrolling</div>
        </div>
        <div id="features"></div>
    </div>

    <script src="./config.js"></script>

    <script>
        document.getElementById('main-title').innerText = config.title;
        document.getElementById('sub-title').innerText = config.subtitle;

        var features = document.getElementById('features');

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');
            
            if (record.image) {
                var image = new Image();
                image.src = record.image;
                image.onclick = function() { openLightbox(this.src); };
                chapter.appendChild(image);
            }

            var textContainer = document.createElement('div');
            textContainer.classList.add('step-text');

            if (record.title) {
                // Split title logic to make the date cursive and the title serif
                var parts = record.title.split(' • ');
                if(parts.length > 1) {
                    var dateEl = document.createElement('div');
                    dateEl.classList.add('date-text');
                    dateEl.innerText = parts[0];
                    textContainer.appendChild(dateEl);
                    
                    var titleEl = document.createElement('h3');
                    titleEl.innerText = parts[1];
                    textContainer.appendChild(titleEl);
                } else {
                    var titleEl = document.createElement('h3');
                    titleEl.innerText = record.title;
                    textContainer.appendChild(titleEl);
                }
            }

            if (record.description) {
                var story = document.createElement('p');
                story.innerHTML = record.description;
                textContainer.appendChild(story);
                
                if(record.image) {
                    var hint = document.createElement('span');
                    hint.classList.add('tap-hint');
                    hint.innerText = "Click to view photo";
                    textContainer.appendChild(hint);
                }
            }

            chapter.appendChild(textContainer);
            container.setAttribute('id', record.id);
            container.classList.add('step');
            container.appendChild(chapter);
            features.appendChild(container);
        });

        mapboxgl.accessToken = config.accessToken;
        var map = new mapboxgl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            interactive: false
        });

        var scroller = scrollama();
        map.on("load", function() {
            scroller.setup({
                step: '.step',
                offset: 0.85,
                progress: true
            })
            .onStepEnter(response => {
                var chapter = config.chapters.find(chap => chap.id === response.element.id);
                response.element.classList.add('active');
                map.flyTo(chapter.location);
            })
            .onStepExit(response => {
                response.element.classList.remove('active');
            });
        });

        function openLightbox(imgSrc) {
            var lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = imgSrc;
            lightbox.style.display = 'flex';
            setTimeout(() => { lightbox.classList.add('show'); }, 10);
        }
        function closeLightbox() {
            var lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('show');
            setTimeout(() => { lightbox.style.display = 'none'; }, 400);
        }

        function toggleMusic() {
            var audio = document.getElementById("bg-music");
            var btn = document.getElementById("music-control");
            if (audio.paused) { 
                audio.play(); 
                btn.innerText = "PAUSE MUSIC"; 
                btn.style.background = "#6b5b4c";
                btn.style.color = "white";
                btn.style.borderColor = "#6b5b4c";
            } else { 
                audio.pause(); 
                btn.innerText = "PLAY MUSIC"; 
                btn.style.background = "transparent";
                btn.style.color = "#666";
                btn.style.borderColor = "#888";
            }
        }
    </script>
</body>
</html>
